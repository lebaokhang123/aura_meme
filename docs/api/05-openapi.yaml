      in: path
      name: slot_kind
      required: true
      schema:
        type: string
        enum:
        - avatar
        - frame
        - icon
        - effect
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 16
      description: CSRF token được cấp bởi GET /api/v1/auth/csrf; bắt buộc trên mọi request thay đổi trạng
        thái (kể cả guest).
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 12
        maxLength: 128
      description: Khóa retry của cùng một lần mở hòm. Cùng khóa và payload trả đúng kết quả cũ; khóa đã dùng
        với payload khác trả 409.
    PostSearch:
      in: query
      name: search
      schema:
        type: string
        maxLength: 100
    PostCategory:
      in: query
      name: category
      schema:
        type: string
      description: Slug danh mục
    PostSort:
      in: query
      name: sort
      schema:
        type: string
        enum:
        - created_desc
        - created_asc
        - title_asc
    AdminStatus:
      in: query
      name: status
      schema:
        type: string
    LeaderboardPeriod:
      in: query
      name: period
      schema:
        type: string
        enum:
        - week
        - all
      description: Tuần tính từ thứ Hai 07:00 giờ Việt Nam; chỉ Aura gốc.
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa đăng nhập / phiên hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột / trùng nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Quá giới hạn yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Lỗi máy chủ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: am_session
      description: Opaque session cookie, HttpOnly, Secure trên HTTPS, SameSite=Lax. Backend tra session trong
        PostgreSQL; không truyền JWT trong response.
