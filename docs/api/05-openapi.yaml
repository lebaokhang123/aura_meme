    PageSize:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PostId:
      in: path
      name: post_id
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      in: path
      name: comment_id
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
