  /api/v1/premium/vnpay-return:
    get:
      tags:
      - Premium Sandbox
      summary: Handle Vnpay Return
      description: 'Handle VNPAY browser return callback.


        IMPORTANT: This endpoint strictly performs signature verification and user
        redirection.

        It DOES NOT mutate order status, and DOES NOT grant subscription entitlements.

        Authoritative state mutation is performed exclusively by handle_vnpay_ipn.'
      operationId: handleVnpayReturn
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/premium/vnpay-ipn:
    get:
      tags:
      - Premium Sandbox
      summary: Handle Vnpay Ipn
      description: 'Handle VNPAY server-to-server IPN callback.


        This is the sole authoritative webhook endpoint that validates transactions,

        updates order status, and activates user subscription entitlements.'
      operationId: handleVnpayIpn
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/premium/paypal/webhook:
    post:
      tags:
      - Premium Sandbox
      summary: Handle Paypal Webhook
      description: Handle PayPal webhook events (e.g. PAYMENT.CAPTURE.COMPLETED) with
        strict fail-closed security.
      operationId: handlePaypalWebhook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
