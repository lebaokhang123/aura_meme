openapi: 3.0.3
info:
  title: AuraMeme API — Design Contract
  version: 0.5.0-design
  description: Thiết kế M0.5 cho một FastAPI modular monolith / PostgreSQL. P0 là blog học phần, P1 là AuraMeme;
    P2 payment/generator chưa cấp hợp đồng vì nghiệp vụ chưa khóa. Chưa phải API đã triển khai. Mỗi operation
    có x-phase.
servers:
- url: /
  description: Same-origin Nginx + /api/v1 (production); local Vite proxy cho /api/v1
tags:
- name: Health
  description: Readiness
- name: Auth
  description: Đăng ký, phiên và CSRF
- name: Account
  description: Hồ sơ cá nhân
- name: Blog
  description: Bài viết, bình luận, danh mục
- name: Media
  description: Ảnh upload
- name: Contact
  description: Liên hệ
- name: Admin
  description: Phân quyền và quản trị
- name: Aura
  description: XP, check-in, leaderboard, tương tác
- name: Vault
  description: Rương, inventory, trang bị
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check (process readiness)
      operationId: health
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/auth/csrf:
    get:
      tags:
      - Auth
      summary: Lấy CSRF token cho form / AJAX
      operationId: getCsrf
      description: Token sinh và xác thực phía server (được ràng buộc với phiên hoặc phiên tiền đăng nhập);
        không đưa vào URL/log.
      security: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                - csrf_token
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Đăng ký tài khoản
      operationId: register
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Tài khoản đã tạo; chưa tự đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập bằng email/mật khẩu
      operationId: login
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 'Xác thực thành công; Set-Cookie: am_session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Đăng xuất, thu hồi session
      operationId: logout
      security: &id001
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã thu hồi session và xoá cookie
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/users/me:
    get:
      tags:
      - Account
      summary: Xem thông tin riêng tư của chính mình
      operationId: getMe
      security: *id001
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivate'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
    patch:
      tags:
      - Account
      summary: Cập nhật hồ sơ
      operationId: updateMe
      security: *id001
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivate'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/users/me/password:
    put:
      tags:
      - Account
      summary: Đổi mật khẩu; thu hồi các phiên khác
      operationId: changePassword
      security: *id001
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Đã đổi mật khẩu và thu hồi các phiên theo chính sách
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/users/{username}:
    get:
      tags:
      - Account
      summary: Xem hồ sơ công khai (không trả PII)
      operationId: getPublicUser
      security: []
      parameters:
      - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/users/{username}/comments:
    get:
      tags:
      - Blog
      summary: Bình luận công khai của tài khoản, mới nhất trước
      operationId: listUserComments
      description: Chỉ trả comment visible/chưa xóa của user active trên bài public; tài khoản thiếu hoặc không active trả 404.
      security: []
      parameters:
      - $ref: '#/components/parameters/Username'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - items
                - pagination
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/categories:
    get:
      tags:
      - Blog
      summary: Liệt kê danh mục hiển thị
      operationId: listCategories
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PostSearch'
      - name: slug
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [slug_asc, name_asc, name_desc]
          default: slug_asc
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryFeedItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - items
                - pagination
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/users/me/posts:
    get:
      tags: [Blog]
      summary: Danh sách bài của chính user, không gồm deleted
      operationId: listOwnPosts
      security: *id001
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [draft, published, hidden]
      - $ref: '#/components/parameters/PostSearch'
      - $ref: '#/components/parameters/PostCategory'
      - $ref: '#/components/parameters/PostSort'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnPost'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required: [items, pagination]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/users/me/posts/{post_id}:
    get:
      tags: [Blog]
      summary: Đọc bài của chính user, kể cả draft; không gồm deleted
      operationId: getOwnPost
      security: *id001
      parameters:
      - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnPost'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/posts:
    get:
      tags:
      - Blog
      summary: 'Danh sách bài viết công khai: tìm/lọc/sắp xếp/phân trang'
      operationId: listPosts
      security:
      - {}
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PostSearch'
      - $ref: '#/components/parameters/PostCategory'
      - in: query
        name: author
        description: Username tác giả, so khớp chính xác; chỉ lọc bài public.
        required: false
        schema: {type: string, maxLength: 32}
      - in: query
        name: sort
        schema: {type: string, enum: [created_desc, created_asc, title_asc, reaction_desc], default: created_desc}
      - in: query
        name: include_interactions
        schema: {type: boolean, default: false}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - items
                - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
    post:
      tags:
      - Blog
      summary: Tạo bài viết thuộc chính user
      operationId: createPost
      security: *id001
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Đã tạo bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/posts/{post_id}:
    get:
      tags:
      - Blog
      summary: Chi tiết bài viết công khai
      operationId: getPost
      security: []
      parameters:
      - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
    patch:
      tags:
      - Blog
      summary: Sửa bài của chính mình
      operationId: updatePost
      security: *id001
      parameters:
      - $ref: '#/components/parameters/PostId'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPatch'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
    delete:
      tags:
      - Blog
      summary: Xoá logic bài của chính mình
      operationId: deletePost
      security: *id001
      parameters:
      - $ref: '#/components/parameters/PostId'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã đánh dấu xoá bài
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/posts/{post_id}/comments:
    get:
      tags:
      - Blog
      summary: Bình luận của bài viết
      operationId: listComments
      security: []
      parameters:
      - $ref: '#/components/parameters/PostId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PostSearch'
      - name: author
        in: query
        required: false
        schema:
          type: string
          maxLength: 32
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [created_asc, created_desc]
          default: created_asc
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                - items
                - pagination
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
    post:
      tags:
      - Blog
      summary: Viết bình luận cho bài công khai
      operationId: addComment
      security: *id001
      parameters:
      - $ref: '#/components/parameters/PostId'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        description: Dữ liệu yêu cầu
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Đã đăng bình luận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/comments/{comment_id}:
    delete:
      tags:
      - Blog
      summary: Xóa logic bình luận của chính mình
      operationId: deleteComment
      security: *id001
      parameters:
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã đánh dấu xoá bình luận
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/media:
    post:
      tags:
      - Media
      summary: Tải một ảnh lên và nhận media ID
      operationId: uploadMedia
      description: Một file JPEG/PNG/WebP/GIF, tối đa 5 MiB và 12.000.000 pixels/frame.
        Ảnh động tối đa 60 frames và 40.000.000 pixels cộng dồn (bao gồm GIF).
        Backend kiểm MIME, signature và decode thật; xác thực session/CSRF/Origin trước parse.
        Bytes gốc lưu private local, metadata PostgreSQL; status ready chỉ trả sau COMMIT.
        url là đường dẫn tương đối cùng origin; GET kiểm lại quyền trước khi xuất ảnh đã bỏ metadata.
      security: *id001
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '201':
          description: Đã tạo metadata ảnh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P0
  /api/v1/media/{media_id}:
    get:
      tags:
      - Media
      summary: Hiển thị ảnh upload theo quyền hiện tại
      operationId: getMedia
      description: Chỉ media ready của bài public hiện tại hoặc avatar/cover của tài khoản active được public.
        Chủ media có session active được preview ảnh draft/chưa gắn. Các trường hợp không có quyền,
        file thiếu/hỏng/link đều trả404, không lộ object key. Không mount storage thành thư mục public.
