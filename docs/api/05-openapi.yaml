              schema:
                $ref: '#/components/schemas/EquipmentResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-phase: P1
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu không hợp lệ
            request_id:
              type: string
              example: req_abc123
            details:
              type: object
              additionalProperties: true
              nullable: true
          required:
          - code
          - message
          - request_id
      required:
      - error
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
      - page
      - page_size
      - total
      - total_pages
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - hidden
      required:
      - id
      - slug
      - name
      - status
    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - username
      - display_name
      - created_at
    UserPrivate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        birth_year:
          type: integer
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_media_id:
          type: string
          format: uuid
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - ADMIN
        status:
          type: string
          enum:
          - active
          - locked
          - deleted
      required:
      - id
      - username
      - email
      - display_name
      - roles
      - status
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserPublic'
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
        content:
          type: string
        media_url:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
          - hidden
          - deleted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        comments_count:
          type: integer
          minimum: 0
      required:
      - id
      - author
      - category
      - title
      - content
      - status
      - created_at
      - updated_at
    PostInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 20000
        category_id:
          type: string
          format: uuid
        media_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
      required:
      - title
      - content
      - category_id
    PostPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 20000
        category_id:
          type: string
          format: uuid
        media_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
      minProperties: 1
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserPublic'
        body:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - post_id
      - author
      - body
      - created_at
    CommentInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - body
    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mime:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - image/gif
        size_bytes:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - pending
          - ready
          - rejected
          - deleted
        url:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - mime
      - size_bytes
      - status
    ContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        subject:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - name
      - email
      - subject
      - body
    ContactMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          enum:
          - new
          - in_review
          - resolved
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - subject
      - body
      - status
      - created_at
    RegisterInput:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - username
      - email
      - password
      - display_name
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    ProfilePatch:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 1000
          nullable: true
        birth_year:
          type: integer
          minimum: 1900
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
        phone:
          type: string
          maxLength: 30
          nullable: true
        avatar_media_id:
          type: string
          format: uuid
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
      minProperties: 1
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 128
      required:
      - current_password
      - new_password
    AdminUserPatch:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - locked
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
      minProperties: 1
    AdminCreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - ADMIN
      required:
      - username
      - email
      - password
      - display_name
      - roles
    AdminRolePatch:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - ADMIN
      required:
      - roles
    AdminPostPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 20000
        category_id:
          type: string
          format: uuid
        media_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
          - hidden
      minProperties: 1
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z0-9-]+$
      required:
      - name
      - slug
    CategoryPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum:
          - active
          - hidden
      minProperties: 1
    AdminContactPatch:
      type: object
      properties:
        status:
          type: string
          enum:
          - new
          - in_review
          - resolved
      required:
      - status
    AdminAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - actor_id
      - action
      - target_type
      - target_id
      - created_at
    AuraProgress:
      type: object
      properties:
        earned_xp:
          type: integer
          minimum: 0
          description: Aura gốc cho Rank và odds
        bonus_xp:
          type: integer
          minimum: 0
          description: Aura thưởng VIP
        total_xp:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
        fair_level:
          type: integer
          minimum: 1
        streak_days:
          type: integer
          minimum: 0
        khi_van_balance:
          type: integer
          minimum: 0
      required:
      - earned_xp
      - bonus_xp
      - total_xp
      - level
      - fair_level
      - streak_days
      - khi_van_balance
    CheckInResult:
      type: object
      properties:
        effective_day:
          type: string
          format: date
        already_checked_in:
          type: boolean
        earned_xp_delta:
          type: integer
          minimum: 0
        bonus_xp_delta:
          type: integer
          minimum: 0
        khi_van_delta:
          type: integer
          minimum: 0
        streak_days:
          type: integer
          minimum: 0
      required:
      - effective_day
      - already_checked_in
      - earned_xp_delta
      - bonus_xp_delta
      - khi_van_delta
      - streak_days
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/UserPublic'
        earned_xp:
          type: integer
          minimum: 0
      required:
      - rank
      - user
      - earned_xp
    ReactionInput:
      type: object
      properties:
        reaction_type:
          type: string
          enum:
          - like
          - laugh
          - fire
      required:
      - reaction_type
    ReactionResult:
      type: object
      properties:
        reaction_type:
          type: string
          enum:
          - like
          - laugh
          - fire
        post_id:
          type: string
          format: uuid
      required:
      - reaction_type
      - post_id
    CaseDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        label:
          type: string
        cost_khi_van:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - active
          - retired
      required:
      - id
      - slug
      - label
      - cost_khi_van
      - status
    CaseBand:
      type: object
      properties:
        min_earned_xp:
          type: integer
          minimum: 0
        max_earned_xp:
          type: integer
          minimum: 0
          nullable: true
        odds_version:
          type: integer
          minimum: 1
        weights_bps:
          type: object
          properties:
            D:
              type: integer
              minimum: 0
              maximum: 10000
            C:
              type: integer
              minimum: 0
              maximum: 10000
            B:
              type: integer
              minimum: 0
              maximum: 10000
            A:
              type: integer
              minimum: 0
              maximum: 10000
            S:
              type: integer
              minimum: 0
              maximum: 10000
          required:
          - D
          - C
          - B
          - A
          - S
      required:
      - min_earned_xp
      - odds_version
      - weights_bps
    CaseDetail:
      type: object
      properties:
        case:
          $ref: '#/components/schemas/CaseDefinition'
        bands:
          type: array
          items:
            $ref: '#/components/schemas/CaseBand'
      required:
      - case
      - bands
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        kind:
          type: string
          enum:
          - avatar
          - frame
          - icon
          - effect
          - generator
        rarity:
          type: string
          enum:
          - D
          - C
          - B
          - A
          - S
        media_url:
          type: string
          format: uri
      required:
      - id
      - slug
      - kind
      - rarity
      - media_url
    CaseOpenResult:
      type: object
      properties:
        open_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        reward:
          $ref: '#/components/schemas/Asset'
        cost_khi_van:
          type: integer
          minimum: 0
        khi_van_balance:
          type: integer
          minimum: 0
        already_processed:
          type: boolean
      required:
      - open_id
      - case_id
      - reward
      - cost_khi_van
      - khi_van_balance
      - already_processed
    InventoryItem:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        quantity:
          type: integer
          minimum: 0
        equipped:
          type: boolean
      required:
      - asset
      - quantity
      - equipped
    EquipmentInput:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          nullable: true
      required:
      - asset_id
    EquipmentResult:
      type: object
      properties:
        slot_kind:
          type: string
          enum:
          - avatar
          - frame
          - icon
          - effect
        asset_id:
          type: string
          format: uuid
          nullable: true
      required:
      - slot_kind
      - asset_id
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Trang, bắt đầu từ 1
    PageSize:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PostId:
      in: path
      name: post_id
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      in: path
      name: comment_id
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      in: path
      name: category_id
      required: true
      schema:
        type: string
        format: uuid
    ContactId:
      in: path
      name: contact_id
      required: true
      schema:
        type: string
        format: uuid
    Username:
      in: path
      name: username
      required: true
      schema:
        type: string
    CaseId:
      in: path
      name: case_id
      required: true
      schema:
        type: string
        format: uuid
    SlotKind:
      in: path
      name: slot_kind
      required: true
      schema:
        type: string
        enum:
        - avatar
        - frame
        - icon
        - effect
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 16
      description: CSRF token được cấp bởi GET /api/v1/auth/csrf; bắt buộc trên mọi request thay đổi trạng
        thái (kể cả guest).
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 12
        maxLength: 128
      description: Khóa retry của cùng một lần mở hòm. Cùng khóa và payload trả đúng kết quả cũ; khóa đã dùng
        với payload khác trả 409.
    PostSearch:
      in: query
      name: search
      schema:
        type: string
        maxLength: 100
    PostCategory:
      in: query
      name: category
      schema:
        type: string
      description: Slug danh mục
    PostSort:
      in: query
      name: sort
      schema:
        type: string
        enum:
        - created_desc
        - created_asc
        - title_asc
    AdminStatus:
      in: query
      name: status
      schema:
        type: string
    LeaderboardPeriod:
      in: query
      name: period
      schema:
        type: string
        enum:
        - week
        - all
      description: Tuần tính từ thứ Hai 07:00 giờ Việt Nam; chỉ Aura gốc.
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa đăng nhập / phiên hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột / trùng nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Quá giới hạn yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Lỗi máy chủ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: am_session
      description: Opaque session cookie, HttpOnly, Secure trên HTTPS, SameSite=Lax. Backend tra session trong
        PostgreSQL; không truyền JWT trong response.
