components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Dữ liệu không hợp lệ
            request_id:
              type: string
              example: req_abc123
            details:
              type: object
              additionalProperties: true
              nullable: true
          required:
          - code
          - message
          - request_id
      required:
      - error
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      required:
      - page
      - page_size
      - total
      - total_pages
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - hidden
      required:
      - id
      - slug
      - name
      - status
    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          description: Đường dẫn /api/v1/catalog/assets/{asset_id} của avatar đang equip, owned, quantity > 0, active và approved; null dùng avatar mặc định.
          type: string
          format: uri-reference
          nullable: true
        bio:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - username
      - display_name
      - created_at
    PublicProfile:
      description: Hồ sơ public chỉ gồm UserPublic; không cover, PII hoặc roles.
      allOf:
      - $ref: '#/components/schemas/UserPublic'
    UserPrivate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        birth_year:
          type: integer
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_media_id:
          type: string
          format: uuid
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
        avatar_url:
          description: Đường dẫn /api/v1/catalog/assets/{asset_id} của avatar đang equip, owned, quantity > 0, active và approved; null dùng avatar mặc định.
          type: string
          format: uri-reference
          nullable: true
        cover_url:
          type: string
          format: uri-reference
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
            - USER
            - ADMIN
        status:
          type: string
          enum:
          - active
          - locked
          - deleted
      required:
      - id
      - username
      - email
      - display_name
      - roles
      - status
    Post:
      properties:
        interactions:
          $ref: "#/components/schemas/PostInteractions"
          nullable: true
        id:
          type: string
          format: uuid
          title: Id
        author:
          $ref: "#/components/schemas/UserPublic"
        category:
          $ref: "#/components/schemas/Category"
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        media_url:
          format: uri-reference
          title: Media Url
          type: string
          nullable: true
        status:
          type: string
          enum:
            - draft
            - published
            - hidden
            - deleted
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
        - id
        - author
        - category
        - title
        - content
        - status
        - created_at
        - updated_at
      title: PostResponse
    OwnPost:
      allOf:
      - $ref: '#/components/schemas/Post'
      - type: object
        properties:
          media_id:
            type: [string, 'null']
            format: uuid
        required: [media_id]
    PostInput:
      properties:
        title:
          type: string
          maxLength: 160
          minLength: 1
          title: Title
        request_id:
          title: Request Id
          type: string
          format: uuid
          nullable: true
        content:
          type: string
          maxLength: 20000
          title: Content
        category_id:
          type: string
          format: uuid
          title: Category Id
        media_id:
          title: Media Id
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - draft
            - published
          title: Status
          default: draft
      additionalProperties: false
      type: object
      required:
        - content
        - category_id
      title: PostInput
    PostPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 20000
        category_id:
          type: string
          format: uuid
        media_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - draft
          - published
      minProperties: 1
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        author:
