name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend non-DB (Windows)
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Deliberately unavailable synthetic target; no real DB or secrets in this job.
      DATABASE_URL: postgresql+psycopg://ci:unused@127.0.0.1:1/aurameme_test
      TEST_DATABASE_URL: ''
      E2E_DATABASE_URL: ''
      DEMO_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install locked test dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - run: python -m pip check
      - name: Run non-DB tests
        run: python -m pytest -q -m "not integration" --ignore=tests/test_migrations.py -k "not test_demo_migration" -ra
      - name: Record coverage boundary
        if: always()
        run: Add-Content $env:GITHUB_STEP_SUMMARY 'Backend non-DB only. PostgreSQL integration, migration/downgrade and backend browser E2E are NOT COVERED.'

  frontend:
    name: Frontend build and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*test.mjs

  browser:
    name: Frontend browser regression
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check API-mode Auth and Social UI with stubbed HTTP transport
        run: npx playwright test --config=../.github/playwright.auth.config.mjs --forbid-only --workers=1 --retries=0 --max-failures=1
      - name: Build explicit mock bundle for demo regression
        run: npm run build -- --mode mock
      - name: Run existing browser suite without retries
        run: npx playwright test --config=../.github/playwright.config.mjs --forbid-only --workers=1 --retries=0 --max-failures=1
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
